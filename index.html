          function applyFavicon(url) {
            if (!url) return;
            document.querySelectorAll('link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach(function (n) { n.parentNode && n.parentNode.removeChild(n); });
            var bust = url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
            ["icon", "shortcut icon", "apple-touch-icon"].forEach(function (rel) {
              var l = document.createElement("link");
              l.rel = rel;
              l.href = bust;
              document.head.appendChild(l);
            });
          }
          var cached = localStorage.getItem("app_favicon_url");
          if (cached) applyFavicon(cached);
          fetch(SUPA_URL + "/rest/v1/app_branding?id=eq.1&select=favicon_url", {
            headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY }
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (rows) {
              var url = rows && rows[0] && rows[0].favicon_url;
              if (url) {
                if (url !== cached) localStorage.setItem("app_favicon_url", url);
                applyFavicon(url);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
