        try {

          function applyFavicon(url) {
            if (!url) return;
            document.querySelectorAll('link[rel~="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach(function (n) { n.parentNode && n.parentNode.removeChild(n); });
            var bust = url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
            ["icon", "shortcut icon", "apple-touch-icon"].forEach(function (rel) {
              var l = document.createElement("link");
              l.rel = rel;
              l.href = bust;
              document.head.appendChild(l);
            });
          }
          var cached = localStorage.getItem("app_favicon_url");
          if (cached) applyFavicon(cached);
          fetch(SUPA_URL + "/rest/v1/app_branding?id=eq.1&select=favicon_url", {
            headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY }
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (rows) {
              var url = rows && rows[0] && rows[0].favicon_url;
              if (url) {
                if (url !== cached) localStorage.setItem("app_favicon_url", url);
                applyFavicon(url);
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <div
        id="il"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:9999"
      >
        <div
          style="width:32px;height:32px;border:3px solid #f0f0f0;border-top-color:#E53935;border-radius:50%;animation:spin .7s linear infinite"
        ></div>
        <style>
          @keyframes spin{to{transform:rotate(360deg)}}
        </style>
      </div>
    </div>
    <script>
      window.__appMounted = false;
      window.setTimeout(() => {
        const loader = document.getElementById("il");
        const retryKey = "__preview_retry_once";
        if (loader && !window.__appMounted && !sessionStorage.getItem(retryKey)) {
          sessionStorage.setItem(retryKey, "1");
          const url = new URL(window.location.href);
          url.searchParams.set("lvb", String(Date.now()));
          window.location.replace(url.toString());
        }
      }, 2500);
    </script>
