<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E53935" />
    <title>Offline · Sahabat Stroban</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 30% 20%, rgba(229,57,53,0.18), transparent 55%),
                    radial-gradient(circle at 70% 80%, rgba(255,193,7,0.15), transparent 55%),
                    #0b0b0d;
        color: #f5f5f7;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 28px 24px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(20,20,22,0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 10px 40px rgba(229,57,53,0.18);
      }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: rgba(229,57,53,0.15); color: #ff8a87;
        padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
        margin-bottom: 14px;
      }
      h1 { font-size: 22px; margin: 4px 0 8px; letter-spacing: -0.01em; }
      p { color: #c7c7cc; font-size: 14px; line-height: 1.55; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: linear-gradient(135deg, #E53935, #FFC107);
        color: #fff; font-weight: 700; font-size: 14px;
        padding: 12px 22px; border-radius: 999px;
        box-shadow: 0 6px 20px rgba(229,57,53,0.35);
        transition: transform .15s ease;
      }
      button:hover { transform: scale(1.03); }
      .meta { margin-top: 18px; font-size: 11px; color: #8e8e93; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">● Offline</div>
      <h1>Tidak ada koneksi internet</h1>
      <p>Aplikasi sedang tidak dapat terhubung. Periksa koneksi Anda, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
      <div class="meta">Sahabat Stroban Service</div>
    </div>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
